[include mainsail.cfg]
[mcu]
#serial: /dev/ttyUSB0
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[virtual_sdcard]
path: /home/mks/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[mcu rpi]
serial: /tmp/klipper_host_mcu

[adxl345]
cs_pin: rpi:None
spi_bus: spidev0.2

[resonance_tester]
accel_chip: adxl345
probe_points:
    117.5, 117.5, 20  # an example

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
square_corner_velocity: 5
# Use those higher values just to configure Input Shaper 
#max_accel: 10000
#max_accel_to_decel: 10000

[stepper_x]
step_pin: !PC12
dir_pin: PB3
enable_pin: !PD2
microsteps: 16
rotation_distance: 40
endstop_pin: PA13
position_endstop: 0
position_max: 235
homing_speed: 80

[stepper_y]
step_pin: PC11
dir_pin: PA15
enable_pin: !PC10
microsteps: 16
rotation_distance: 40
endstop_pin: PB8
position_endstop: 0
position_max: 235
homing_speed: 80

[stepper_z]
step_pin: PC7
dir_pin: !PC9
enable_pin: !PC8
rotation_distance: 8
microsteps: 16

endstop_pin: !PC14
position_endstop: 6.4
position_min: -2
position_max: 280

homing_speed: 10
homing_retract_dist: 0

[extruder]
max_extrude_only_distance: 600.0
max_extrude_only_velocity: 30.0   # Padrao costuma ser 50 ou mais; diminua para 20-30 se estiver pulando passo
max_extrude_only_accel: 1000.0    # Opcional: reduz tambem a aceleracao se o tranco inicial for muito forte
step_pin: PB10
dir_pin: PB1
enable_pin: !PC6
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA6
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC1
min_temp: 0
max_temp: 250
# Calibrate E-Steps https://www.klipper3d.org/Rotation_Distance.html#calibrating-rotation_distance-on-extruders
rotation_distance: 24
# Calibrate PID: https://www.klipper3d.org/Config_checks.html#calibrate-pid-settings
#  - Example: PID_CALIBRATE HEATER=extruder TARGET=200
control = pid
pid_kp = 30.356
pid_ki = 1.857
pid_kd = 124.081
# Calibrate PA: https://www.klipper3d.org/Pressure_Advance.html
pressure_advance = 0.22

[heater_bed]
heater_pin: PA5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
max_temp: 110
min_temp: 0
# Calibrate PID: https://www.klipper3d.org/Config_checks.html#calibrate-pid-settings
#  - Example: PID_CALIBRATE HEATER=heater_bed TARGET=60
control = pid
pid_kp = 64.230
pid_ki = 0.723
pid_kd = 1425.905

[heater_fan hotend_fan]
pin: PA7
heater: extruder
heater_temp: 50.0

[fan]
pin: PB0

[force_move]
enable_force_move: True

[homing_override]
axes: z
set_position_z: 0
gcode:
    # Subida inicial de 20 mm
    G90
    G1 Z8 F300

    # Home X e Y
    G28 X Y

    # Centralizar
    G1 X117.5 Y117.5 F6000

    # Etapa 1: sensor optico PC14
    G28 Z

    # Etapa 2: Strain gauge PC13
    # Primeiro toque - 1.0 mm/s
    PROBE PROBE_SPEED=2.0 SAMPLES=1
    
    # Recuar 1mm
    G91
    G1 Z1 F300
    G90
    
    # Segundo toque - 0.2 mm/s
    PROBE PROBE_SPEED=0.2 SAMPLES=2 SAMPLE_RETRACT_DIST=1
    
    # Afastar o bico 10mm
    G91
    G1 Z2 F300
    G90

# Strain Gauge Sensor config -> Precisa mudar os cabos na placa mãe
[probe]
pin: !PC13
speed: 0.5
lift_speed: 5
samples: 2
sample_retract_dist: 1
activate_gcode: TARE_PROBE
deactivate_gcode: TARE_PROBE

[gcode_macro TARE_PROBE]
gcode:
    G4 P250

[filament_motion_sensor filament_sensor]
extruder: extruder
pause_on_runout: true
switch_pin: PB4

[bed_mesh]
speed: 200
horizontal_move_z: 1
mesh_min: 20,20
mesh_max: 200,200
probe_count: 8, 8
algorithm: bicubic
fade_start: 1.0
fade_end: 10
fade_target: 0

#speed: 50 #SGS config
#horizontal_move_z: 2.0 #SGS config
#mesh_min: 20,20 #SGS config
#mesh_max: 200,200 #SGS config
#probe_count: 4,4 #SGS config
#algorithm: bicubic #SGS config
#fade_start: 1 #SGS config
#fade_end: 10 #SGS config
#fade_target: 0 #SGS config

[input_shaper]
# Calibrate IS: https://www.klipper3d.org/Resonance_Compensation.html
shaper_type_x = mzv
shaper_type_y = ei
shaper_freq_y = 35
shaper_freq_x = 80

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
#min_temp: 10
#max_temp: 105

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
sensor_temperature1: 25
sensor_adc1: 0.210317
#min_temp: 0
#max_temp: 105

[delayed_gcode bed_mesh_init]
initial_duration: .01
gcode:
  BED_MESH_PROFILE LOAD=default

[idle_timeout]
timeout: 43200
# Tempo em segundos (exemplo: 1800 segundos = 30 minutos)
# Opcional: define quais comandos executar quando o tempo expirar
gcode:
  TURN_OFF_HEATERS
  M84

[pause_resume]
# This enables Klipper's native pause and resume functionality

[exclude_object]

[gcode_macro M0]
description: Map Marlin M0 pause command to Klipper PAUSE
gcode:
    PAUSE


[gcode_macro M420]
description: Load the current mesh
gcode:
  BED_MESH_PROFILE LOAD=default

[gcode_macro G29]
description: creates automated homing and bed mesh
gcode:
  # esquenta a mesa até 60 graus
  M140 S60 
  # Espera a mesa esquentar até 60 graus
  M190 S60 
  G28
  BED_MESH_CALIBRATE
  #Turn-off fan
  M106 S0 
  #Turn-off hotend
  M104 S0 
  #Turn-off bed
  M140 S0 
  SAVE_CONFIG
  
[gcode_macro LOAD_FILAMENT]
variable_load_distance:  400
variable_purge_distance:  25
variable_min_temp: 180
gcode:
    {% set speed = params.SPEED|default(100) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity * 60 %}
    SAVE_GCODE_STATE NAME=load_state

    # Garante temperatura minima para extrusao
    {% if printer.extruder.temperature < min_temp %}
        M104 S{min_temp} ; Inicia aquecimento se ainda nao estiver
        M109 S{min_temp} ; Aguarda atingir a temperatura minima
    {% endif %}
    
    # Home apenas se algum eixo nao estiver referenciado
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

	# Move para a coordenada absoluta X0 Y0
    G90
    G1 X0 Y0 F5000.0

    G91
    G92 E0
    G1 E{load_distance} F{speed*2} # fast-load
    G1 E{purge_distance} F{speed} # purge
    RESTORE_GCODE_STATE NAME=load_state

[gcode_macro UNLOAD_FILAMENT]
variable_unload_distance: 400
variable_purge_distance: 10
variable_min_temp: 180
gcode:
    {% set speed = params.SPEED|default(100) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity * 60 %}
    SAVE_GCODE_STATE NAME=unload_state

    # Garante temperatura minima para extrusao
    {% if printer.extruder.temperature < min_temp %}
        M104 S{min_temp} ; Inicia aquecimento
        M109 S{min_temp} ; Aguarda atingir a temperatura minima
    {% endif %}

    # Home apenas se algum eixo nao estiver referenciado
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

	# Move para a coordenada absoluta X0 Y0
    G90
    G1 X0 Y0 F5000.0

    G91
    G92 E0
    # Empurra ligeiramente para modelar a ponta e derreter a zona de transicao
    G1 E{purge_distance} F{speed}
    # Retracao rapida para descarregar o tubo
    G1 E-{unload_distance} F{speed*2}
    
    RESTORE_GCODE_STATE NAME=unload_state

    
# --------------------------- Start Print ----------------------------
[gcode_macro START_PRINT]
variable_bed_temp: 60
variable_extruder_temp: 185
gcode:
    BED_MESH_PROFILE LOAD=default
    # recover bed_mesh
    M420
    # Start bed heating
    M140 S{bed_temp}
    # Set and wait for nozzle to reach temperature
    M109 S{extruder_temp}
    # Wait for bed to reach temperature
    M190 S{bed_temp}
    # Use absolute coordinates
    G90
    # Reset the G-Code Z offset (adjust Z offset if needed)
    #SET_GCODE_OFFSET Z=0.0
    # Home the printer
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    # Move the nozzle near the bed
    G1 Z5 F3000
    # Move the nozzle very close to the bed
    G1 Z0.15 F300
    # Reset Extruder
    G92 E0
    # Move Z Axis up
    G1 Z2.0 F3000
    # Move to start position
    G1 X1.1 Y20 Z0.28 F5000.0
    # Draw the first line
    G1 X1.1 Y200.0 Z0.28 F1500.0 E20
    # Move to side a little
    G1 X1.4 Y200.0 Z0.28 F5000.0
    # Draw the second line
    G1 X1.4 Y20 Z0.28 F1500.0 E35
    # Reset Extruder
    G92 E0
    # Move Z Axis up
    G1 Z2.0 F3000
    # Print message on LCD
    M117 By your command!
# --------------------------------------------------------------------

# ---------------------------- End Print -----------------------------
[gcode_macro END_PRINT]
variable_machine_depth: 235
gcode:
    # Turn off bed, extruder, and fan
    M140 S0
    M104 S0
    M106 S0
    # Relative positionning
    G91
    # Retract and raise Z
    G1 Z0.2 E-10 F2400
    # Wipe out
    G1 X5 Y5 F3000
    # Raise Z more
    G1 Z10
    # Absolute positionning
    G90
    # Present print
    G1 X0 Y{machine_depth}
    # Disable steppers
    M84
    # Print message on LCD
    M117 That's All Folks
# --------------------------------------------------------------------

